  <div id="root"></div>

  <!--Кусок с script ниже сейчас применяю для проверки реального размера устройств, потом убрать нужно-->
  <script>
  (() => {
    const params = new URLSearchParams(window.location.search);

    if (!params.has("debugViewport")) {
      return;
    }

    function getSafeAreaInsets() {
      const probe = document.createElement("div");

      probe.style.cssText = `
        position: fixed;
        inset: auto;
        width: 0;
        height: 0;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        visibility: hidden;
        pointer-events: none;
      `;

      document.body.appendChild(probe);

      const styles = window.getComputedStyle(probe);
      const result = {
        top: styles.paddingTop,
        right: styles.paddingRight,
        bottom: styles.paddingBottom,
        left: styles.paddingLeft,
      };

      probe.remove();

      return result;
    }

    function createOverlay() {
      const existing = document.getElementById("viewport-debug-overlay");

      if (existing) {
        existing.remove();
      }

      const box = document.createElement("div");

      box.id = "viewport-debug-overlay";
      box.style.cssText = `
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 999999;
        max-width: calc(100vw - 16px);
        padding: 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        font: 12px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        white-space: pre;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        pointer-events: none;
      `;

      document.body.appendChild(box);

      const update = () => {
        const vv = window.visualViewport;
        const safe = getSafeAreaInsets();

        box.textContent = [
          `inner: ${window.innerWidth} × ${window.innerHeight}`,
          `visual: ${Math.round(vv?.width ?? 0)} × ${Math.round(vv?.height ?? 0)}`,
          `client: ${document.documentElement.clientWidth} × ${document.documentElement.clientHeight}`,
          `screen: ${window.screen.width} × ${window.screen.height}`,
          `dpr: ${window.devicePixelRatio}`,
          `scale: ${vv?.scale ?? "-"}`,
          `offset: ${Math.round(vv?.offsetLeft ?? 0)}, ${Math.round(vv?.offsetTop ?? 0)}`,
          `safe: ${safe.top} ${safe.right} ${safe.bottom} ${safe.left}`,
          `scrollY: ${Math.round(window.scrollY)}`,
        ].join("\n");
      };

      update();

      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      window.addEventListener("scroll", update, { passive: true });
      window.visualViewport?.addEventListener("resize", update);
      window.visualViewport?.addEventListener("scroll", update);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", createOverlay);
    } else {
      createOverlay();
    }
  })();
</script>
